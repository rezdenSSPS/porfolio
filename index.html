    <!-- Preload LCP image (hero image) -->
    <link rel="preload" href="/denis.jpg" as="image" fetchpriority="high" />
    
    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Prevent FOUC and CLS */
      :root {
        --background: oklch(0.9821 0 0);
        --foreground: oklch(0.3485 0 0);
      }
      .dark {
        --background: oklch(0.2891 0 0);
        --foreground: oklch(0.8945 0 0);
      }
      body {
        font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        background-color: var(--background);
        color: var(--foreground);
        margin: 0;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading spinner for initial load */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
        z-index: 9999;
        transition: opacity 0.3s;
      }
      .initial-loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--foreground);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="initial-loader" id="initial-loader">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide loader when app is ready
      window.addEventListener('load', function() {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('hide');
          setTimeout(function() { loader.remove(); }, 300);
        }
      });
      // Set theme from localStorage to prevent flash
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </body>
</html>
